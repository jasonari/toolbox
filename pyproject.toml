[project]
name = "toolbox"
version = "0.1.0"
description = "Personal Python toolbox"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"
